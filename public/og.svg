<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Matemática.já: entre, escolha um módulo e pratique matemática">
  <rect width="1200" height="630" fill="#f7f4eb"/>
  <path d="M0 557h1200" stroke="#bed4c9" stroke-width="3" stroke-dasharray="11 12"/>
  <rect x="64" y="57" width="63" height="63" rx="19" fill="#203438" transform="rotate(-7 95 88)"/>
  <rect x="83" y="75" width="11" height="11" rx="3" fill="#ffe092"/>
  <rect x="99" y="75" width="11" height="11" rx="3" fill="#f07b60"/>
