    <text x="62" y="374" fill="#dc654f" font-size="73" font-weight="bold" letter-spacing="-4">melhor jogando.</text>
    <text x="66" y="430" fill="#53686a" font-size="28">Escolha um módulo, resolva e tente de novo.</text>
    <rect x="65" y="477" width="315" height="62" rx="15" fill="#203438"/>
    <text x="93" y="517" fill="#fffdf7" font-size="25" font-weight="bold">Entrar para jogar  →</text>
    <text x="66" y="597" fill="#526c6a" font-size="20">Sem cadastro · 6 módulos · 120 questões</text>
  </g>
  <g transform="translate(799 123)">
    <rect x="8" y="10" width="327" height="350" rx="33" fill="#203438"/>
    <rect width="327" height="350" rx="33" fill="#ffe5a7" stroke="#203438" stroke-width="4"/>
